name: Build Pentax K-1 Sync APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Compile Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Build Debug & Release APKs
        run: gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Rename Release APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/PentaxK1Sync-v1.0.0-release.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/PentaxK1Sync-v1.0.0-debug.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PentaxK1Sync-APK
          path: dist/*.apk
          retention-days: 30
